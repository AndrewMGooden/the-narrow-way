<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{-webkit-text-size-adjust:100%}
body{margin:0;-webkit-tap-highlight-color:transparent}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>The Narrow Way</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Press+Start+2P&display=swap">
<style>
/* Layout: a lamp-lit codex — pixel scene window, scripture beneath, choices as cut stone,
   and a battle board that takes the screen when steel comes out.
   Deliberate single-world design: this is a lamp in the dark, so there is no light theme. */
:root{
  color-scheme: dark;
  --ink:#0d0a16;
  --vault:#161029;
  --vault-2:#1f1838;
  --edge:#352a57;
  --lamp:#e0b24a;
  --lamp-dim:#8a6c2e;
  --flame:#d9622b;
  --blood:#a2302e;
  --blood-lit:#d4716f;
  --parch:#ece4d2;
  --parch-dim:#9a90ac;
  --sky:#7fa6d8;
  --leaf:#6fae7a;
  --font-display:"Press Start 2P","Courier New",monospace;
  --font-body:"EB Garamond",Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--ink);
  color:var(--parch);
  font-family:var(--font-body);
  font-size:19px;
  line-height:1.62;
  padding-block:20px 48px;
  padding-left:16px;padding-right:16px;
  background-image:radial-gradient(ellipse 80% 55% at 50% 0%, #1b1333 0%, var(--ink) 70%);
  background-attachment:fixed;
}
.frame{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:18px}

h1{margin:0;font-family:var(--font-display);font-size:clamp(17px,5.2vw,26px);color:var(--lamp);
   text-wrap:balance;line-height:1.5;text-shadow:0 0 18px rgba(224,178,74,.35)}
.byline{margin:0;font-family:var(--font-display);font-size:9px;letter-spacing:.18em;
  color:var(--lamp-dim);text-transform:uppercase}
.tagline{margin:0;color:var(--parch-dim);font-size:18px;font-style:italic;text-wrap:balance}
.act{font-family:var(--font-display);font-size:9px;color:var(--lamp-dim);letter-spacing:.14em;text-transform:uppercase}
.prose p{margin:0 0 .85em}
.prose p:last-child{margin-bottom:0}
.verse{border-left:3px solid var(--lamp-dim);padding:2px 0 2px 14px;color:var(--lamp);
  font-style:italic;font-size:17px;opacity:.92}

/* ---- scene window ---- */
.window{position:relative;border:3px solid var(--edge);background:#000;overflow:hidden}
.window canvas{display:block;width:100%;height:auto;aspect-ratio:32/14;image-rendering:pixelated}
.window::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(to bottom,rgba(0,0,0,.22) 0 1px,transparent 1px 3px);
  box-shadow:inset 0 0 60px rgba(13,10,22,.85)}

/* ---- hud ---- */
.hud{display:flex;gap:14px;align-items:center;flex-wrap:wrap;
  border:2px solid var(--edge);background:var(--vault);padding:12px 14px}
.hud canvas.av{width:48px;height:48px;image-rendering:pixelated;flex:none;
  border:2px solid var(--edge);background:var(--vault-2)}
.who{min-width:0;flex:1 1 150px}
.who .nm{font-family:var(--font-display);font-size:11px;color:var(--parch);word-break:break-word}
.who .og{font-size:16px;color:var(--parch-dim);font-style:italic}
.meters{display:grid;grid-template-columns:repeat(2,minmax(92px,1fr));gap:7px 14px;flex:2 1 230px;min-width:0}
.meter{min-width:0}
.meter .lab{display:flex;justify-content:space-between;font-family:var(--font-display);
  font-size:7px;color:var(--parch-dim);letter-spacing:.1em;margin-bottom:3px;gap:6px}
.meter .lab b{color:var(--parch);font-weight:400;font-variant-numeric:tabular-nums}
.bar{height:8px;background:#0b0816;border:1px solid var(--edge);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c,var(--lamp));transition:width .35s ease}
.vigor .bar{height:11px}

/* ---- choices ---- */
.choices{display:flex;flex-direction:column;gap:10px}
button.pick{
  font:inherit;text-align:left;color:var(--parch);background:var(--vault-2);
  border:2px solid var(--edge);border-left-width:5px;padding:12px 14px;cursor:pointer;
  display:flex;gap:12px;align-items:flex-start;min-width:0;
  transition:background .14s,border-color .14s,transform .14s}
button.pick .n{font-family:var(--font-display);font-size:9px;color:var(--lamp-dim);
  padding-top:5px;flex:none}
button.pick .tx{min-width:0;flex:1}
button.pick:hover:not(:disabled),button.pick:focus-visible:not(:disabled){
  background:#2a2049;border-color:var(--lamp);transform:translateX(3px)}
button.pick:hover:not(:disabled) .n{color:var(--lamp)}
button.pick:disabled{opacity:.45;cursor:not-allowed;border-left-color:var(--blood)}
button.pick.danger{border-left-color:var(--blood)}
button.pick .req{display:block;font-family:var(--font-display);font-size:7px;
  color:var(--blood-lit);letter-spacing:.08em;margin-top:7px}
button.pick .tag{display:inline-block;font-family:var(--font-display);font-size:7px;
  letter-spacing:.08em;margin-top:7px;color:var(--flame);border:1px solid var(--flame);padding:3px 5px}
:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}

/* ---- marks & items ---- */
.marks{display:flex;flex-wrap:wrap;gap:6px}
.mark{font-family:var(--font-display);font-size:7px;letter-spacing:.06em;
  border:1px solid var(--edge);background:var(--vault);color:var(--parch-dim);padding:5px 7px}
.mark.good{border-color:var(--lamp-dim);color:var(--lamp)}
.mark.bad{border-color:#5a2020;color:var(--blood-lit)}
.mark.item{border-color:var(--sky);color:var(--sky)}
.mark.wound{border-color:var(--blood);color:var(--blood-lit)}
.section-lab{font-family:var(--font-display);font-size:7px;letter-spacing:.14em;
  color:var(--parch-dim);text-transform:uppercase}
.stack{display:flex;flex-direction:column;gap:7px}

/* ---- battle ---- */
.battle{border:3px solid var(--blood);background:#130c1f;display:flex;flex-direction:column}
.battle-top{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:2px solid var(--edge);flex-wrap:wrap}
.battle-top canvas{width:72px;height:72px;image-rendering:pixelated;flex:none;
  border:2px solid var(--blood);background:#0a0613}
.foe{flex:1 1 180px;min-width:0}
.foe .fn{font-family:var(--font-display);font-size:11px;color:var(--blood-lit);line-height:1.5}
.foe .fd{font-size:16px;color:var(--parch-dim);font-style:italic;margin-top:3px}
.foe .bar{height:12px;margin-top:7px}
.foe .bar i{background:var(--blood)}
.log{padding:12px 14px;display:flex;flex-direction:column;gap:5px;
  max-height:200px;overflow-y:auto;background:#0a0613}
.log p{margin:0;font-size:17px;line-height:1.5}
.log p.hit{color:var(--lamp)}
.log p.hurt{color:var(--blood-lit)}
.log p.holy{color:var(--sky)}
.log p.roll{font-family:var(--font-display);font-size:8px;color:var(--parch-dim);letter-spacing:.08em}
.acts-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:9px;padding:12px 14px;
  border-top:2px solid var(--edge)}
button.act-btn{font:inherit;cursor:pointer;background:var(--vault-2);color:var(--parch);
  border:2px solid var(--edge);padding:10px 11px;text-align:left;min-width:0;
  display:flex;flex-direction:column;gap:3px;transition:border-color .14s,background .14s}
button.act-btn .t{font-family:var(--font-display);font-size:9px;color:var(--lamp)}
button.act-btn .d{font-size:15px;color:var(--parch-dim);font-style:italic;line-height:1.35}
button.act-btn:hover:not(:disabled){border-color:var(--lamp);background:#2a2049}
button.act-btn:disabled{opacity:.4;cursor:not-allowed}
.dice{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.die{font-family:var(--font-display);font-size:10px;width:26px;height:26px;display:flex;
  align-items:center;justify-content:center;border:2px solid var(--lamp-dim);color:var(--lamp);
  background:#0b0816}
.die.crit{border-color:var(--lamp);color:var(--ink);background:var(--lamp)}
.die.fumble{border-color:var(--blood);color:var(--blood-lit)}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.shake{animation:shake .3s ease}

/* ---- title screen ---- */
.card{border:2px solid var(--edge);background:var(--vault);padding:18px}
.field{display:flex;flex-direction:column;gap:7px;margin-bottom:16px}
label.lab{font-family:var(--font-display);font-size:8px;letter-spacing:.12em;color:var(--lamp-dim);text-transform:uppercase}
input[type=text]{font:inherit;font-size:19px;color:var(--parch);background:#0b0816;
  border:2px solid var(--edge);padding:9px 11px;width:100%}
input[type=text]:focus{border-color:var(--lamp);outline:none}
.origins{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px}
.origin{font:inherit;text-align:left;cursor:pointer;background:var(--vault-2);
  border:2px solid var(--edge);padding:11px 12px;color:var(--parch);min-width:0;
  display:flex;flex-direction:column;gap:3px;transition:border-color .14s,background .14s}
.origin:hover{border-color:var(--lamp-dim)}
.origin[aria-pressed=true]{border-color:var(--lamp);background:#2a2049}
.origin .t{font-family:var(--font-display);font-size:9px;line-height:1.6;color:var(--lamp)}
.origin .b{font-size:16px;color:var(--parch-dim);font-style:italic}
.origin .k{font-size:15px;color:var(--sky)}
.row{display:flex;gap:10px;flex-wrap:wrap}
button.go{font-family:var(--font-display);font-size:10px;letter-spacing:.06em;cursor:pointer;
  background:var(--lamp);color:#1a1205;border:2px solid var(--lamp);padding:13px 18px;
  transition:filter .14s}
button.go:hover{filter:brightness(1.12)}
button.go:disabled{background:var(--vault-2);color:var(--parch-dim);border-color:var(--edge);cursor:not-allowed}
button.ghost{font-family:var(--font-display);font-size:9px;cursor:pointer;background:transparent;
  color:var(--parch-dim);border:2px solid var(--edge);padding:11px 14px}
button.ghost:hover{border-color:var(--lamp-dim);color:var(--lamp)}

/* ---- ending ---- */
.badge{display:inline-block;font-family:var(--font-display);font-size:8px;letter-spacing:.16em;
  padding:7px 10px;border:2px solid currentColor;text-transform:uppercase}
.end-death{color:var(--blood-lit)}.end-bond{color:#9ba3bd}.end-doom{color:#b8322f}
.end-win{color:var(--lamp)}.end-crown{color:#f6edd4}
.end-title{font-family:var(--font-display);font-size:clamp(13px,4.2vw,19px);line-height:1.6;margin:0;text-wrap:balance}
.ledger{border:2px solid var(--edge);background:var(--vault);padding:14px;display:flex;flex-direction:column;gap:12px}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:7px}
.slot{border:1px solid var(--edge);background:#0b0816;padding:7px 8px;font-family:var(--font-display);
  font-size:7px;line-height:1.6;color:var(--parch-dim);min-width:0;word-break:break-word}
.slot.got{border-color:var(--lamp-dim);color:var(--lamp)}
.foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;
  border-top:1px solid var(--edge);padding-top:14px;color:var(--parch-dim);font-size:15px;font-style:italic}
.foot span:first-child{flex:1 1 200px;min-width:0}
.footbtns{display:flex;gap:8px;flex-wrap:wrap;flex:none}


/* ---- place & time banner ---- */
.place{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline;
  border-left:3px solid var(--lamp-dim);padding:4px 0 4px 12px}
.place .wh{font-family:var(--font-display);font-size:8px;letter-spacing:.14em;color:var(--lamp);
  text-transform:uppercase;line-height:1.7}
.place .wn{font-size:16px;color:var(--parch-dim);font-style:italic}

/* ---- act title card ---- */
.cardwipe{position:fixed;inset:0;z-index:40;background:var(--ink);display:flex;
  align-items:center;justify-content:center;padding:24px 16px;
  animation:wipe 2.1s ease forwards;pointer-events:none}
.cardwipe .inner{text-align:center;display:flex;flex-direction:column;gap:12px;max-width:520px}
.cardwipe .ch{font-family:var(--font-display);font-size:8px;letter-spacing:.24em;
  color:var(--lamp-dim);text-transform:uppercase}
.cardwipe .ct{font-family:var(--font-display);font-size:clamp(13px,4.4vw,22px);
  line-height:1.6;color:var(--lamp);text-wrap:balance;text-shadow:0 0 20px rgba(224,178,74,.35)}
.cardwipe .cw{font-size:17px;color:var(--parch-dim);font-style:italic}
@keyframes wipe{0%{opacity:0}14%{opacity:1}72%{opacity:1}100%{opacity:0}}

/* ---- floating stat changes ---- */
.floats{position:fixed;left:50%;top:22%;transform:translateX(-50%);z-index:45;
  display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.float{font-family:var(--font-display);font-size:11px;letter-spacing:.1em;
  padding:7px 11px;border:2px solid currentColor;background:rgba(13,10,22,.92);
  animation:rise 1.8s ease forwards;white-space:nowrap}
.float.up{color:var(--lamp)}
.float.down{color:var(--blood-lit)}
.float.item{color:var(--sky)}
.float.mark{color:var(--parch)}
@keyframes rise{0%{opacity:0;transform:translateY(14px) scale(.92)}
  18%{opacity:1;transform:translateY(0) scale(1)}
  74%{opacity:1;transform:translateY(0)}
  100%{opacity:0;transform:translateY(-22px)}}

/* ---- condition chips ---- */
.cond{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--font-display);font-size:7px;letter-spacing:.08em;padding:5px 7px;
  border:1px solid currentColor}
.chip.hurt{color:var(--blood-lit)}
.chip.bless{color:var(--lamp)}
.chip.afraid{color:#b48ad8}
.chip.armed{color:var(--sky)}

.bridgetext p{color:var(--parch-dim)}
.bridgetext p.recall{color:var(--parch);border-left:2px solid var(--lamp-dim);
  padding-left:12px;font-style:italic}
.bridgelab{color:var(--lamp)!important}

/* ---- splash ---- */
.splash{position:fixed;inset:0;z-index:50;background:var(--ink);
  background-image:radial-gradient(ellipse 70% 50% at 50% 42%, #231746 0%, var(--ink) 72%);
  display:flex;align-items:center;justify-content:center;
  padding:24px 16px;opacity:1;transition:opacity .75s ease}
.splash[data-going="1"]{opacity:0;pointer-events:none}
.splash-inner{display:flex;flex-direction:column;align-items:center;gap:14px;
  text-align:center;max-width:520px;width:100%}
.splash canvas{width:128px;height:128px;image-rendering:pixelated;
  filter:drop-shadow(0 0 22px rgba(224,178,74,.45))}
.splash-title{margin:0;font-family:var(--font-display);
  font-size:clamp(16px,5.6vw,30px);line-height:1.5;color:var(--lamp);
  letter-spacing:.04em;text-wrap:balance;text-shadow:0 0 24px rgba(224,178,74,.4)}
.splash-by{margin:0;font-family:var(--font-display);font-size:clamp(8px,2.6vw,11px);
  letter-spacing:.2em;color:var(--parch);text-transform:uppercase}
.splash-hint{margin:14px 0 0;font-family:var(--font-display);font-size:8px;
  letter-spacing:.18em;color:var(--parch-dim);text-transform:uppercase;
  animation:pulse 2.1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:.95}}
body[data-splash="1"]{overflow:hidden}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="splash" id="splash">
  <div class="splash-inner">
    <canvas id="splashArt" aria-hidden="true"></canvas>
    <h1 class="splash-title">THE NARROW WAY</h1>
    <p class="splash-by">by Andrew Gooden</p>
    <p class="splash-hint">Tap to begin</p>
  </div>
</div>

<div class="frame">
  <div id="app"></div>
  <div class="foot">
    <span id="footnote">The Narrow Way — a game by Andrew Gooden</span>
    <span class="footbtns">
      <button class="ghost" id="sound" type="button" aria-pressed="true">Sound on</button>
      <button class="ghost" id="reset" type="button" hidden>Abandon run</button>
    </span>
  </div>
</div>

<script>
"use strict";

/* ================= pixel art ================= */
var PAL = {
  ".":null, K:"#07050e", N:"#171030", D:"#2b1f4d", P:"#463273", V:"#6b5a9e",
  S:"#c9bda0", W:"#f2ecd8", G:"#e0b24a", O:"#d9622b", R:"#9e2b2b",
  B:"#2f5d8a", A:"#74a9d8", E:"#3f6b43", T:"#6b4a2a", Y:"#a8813f", C:"#6b5a9e",
  M:"#4a1f1f", L:"#c4504e", X:"#1b1430", F:"#e8d9a8"
};

function drawGrid(cv, rows, w, h, swap){
  var ctx = cv.getContext("2d");
  cv.width = w; cv.height = h;
  ctx.clearRect(0,0,w,h);
  for (var y=0; y<h; y++){
    var row = (rows[y] || "");
    for (var x=0; x<w; x++){
      var ch = row.charAt(x) || ".";
      var col = (swap && swap[ch]) ? swap[ch] : PAL[ch];
      if (!col) continue;
      ctx.fillStyle = col;
      ctx.fillRect(x,y,1,1);
    }
  }
}

/* ================= scenes (32x14) ================= */

  dagon:[

    "SSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSS","SSSSSWWSSSSSSSSSSSSSSSSSSWWSSSSS",

    "SSSSSWWSSSSSKKKKKKSSSSSSSSWWSSSS","TTTTTWWTTTTTKKKKKKTTTTTTTTWWTTTT",
    "TTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTT","TTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTT"],
  endor:[

    "TTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTT","TTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTT"],
  gilboa:[
    "DDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDD","DDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDD",
    "DDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDD","NNNNNNNNNNNNDDDDDDDDNNNNNNNNNNNN",
    "NNNNNNNNNNDDDDDDDDDDDDNNNNNNNNNN","NNNNNNNNDDDDDDDDDDDDDDDDNNNNNNNN",

N.ba3 = { act:"The Roof of the King", scene:"palace", where:"The king's hall", when:"Night",

N.s1b = { act:"The City of the Plain", scene:"sodom",
 where:"Lot's house, the upper room", when:"Supper",
 text:["His name is Lot. He has a wife who says eleven words the entire evening and two unmarried daughters who say a great many more, and a house far better than a herdsman's nephew has any business owning.",
       "'You're wondering why I stay,' he says, pouring. 'Everyone does. I came for the water. The plain was like the garden of the Lord, before. You could not imagine it now.'",
       "His wife sets down a dish harder than she needs to.",
       "'He stays,' she says, 'because our daughters are married to men of this city, and because he sits in the gate, and a man who sits in the gate is somebody.'",
       "Nobody speaks for a moment.",
       "Then there is a knock at the street door, and Lot's face changes, and you understand that in this house a knock after dark is not a normal thing."],
 verse:"2 Peter 2:8 — that righteous man vexed his righteous soul from day to day.",
 choices:[
  {t:"Go down with him and stand behind the door as he opens it.", fx:{courage:1}, to:"s1c"},
  {t:"Ask his wife, quietly, what usually happens next.", fx:{wisdom:2}, to:"s1c"},
  {t:"Say nothing. Watch everyone's hands.", fx:{wisdom:1}, to:"s1c"}
 ]};

N.s1c = { act:"The City of the Plain", scene:"sodom",
 where:"The street door", when:"After dark",
 text:["Two men. Travellers, by the dust. Young, or not young — you look at them twice and get a different answer.",
       "Lot is on the step in front of them with his hands out and he is almost begging.",
       "'Behold now, my lords, turn in, I pray you, into your servant's house, and tarry all night.'",
       "'Nay,' one of them says, 'but we will abide in the street all night.'",
       "And Lot says — too fast, too loud, with his eyes going up the lane both ways — 'No. No. You will not.'",
       "One of the strangers looks past Lot's shoulder. Directly at you. Not at your face. At something slightly behind it.",
       "Then he steps inside."],
 verse:"Genesis 19:2 — nay; but we will abide in the street all night.",
 choices:[
  {t:"Bar the door behind them. Both bars.", fx:{wisdom:2,courage:1}, to:"s1d"},
  {t:"Ask the strangers outright who they are and what they want here.", fx:{courage:2,faith:1}, to:"s1c2"},
  {t:"Go up to the roof and look down the lane.", fx:{wisdom:3}, to:"s1c3"}
 ]};

N.s1c2 = { act:"The City of the Plain", scene:"sodom",
 where:"The lower room", when:"Late",
 text:["The taller one considers the question as though nobody has ever asked it before.",
       "'The cry of this place is great,' he says. 'It has come up. We were sent down to see whether it is altogether according to the cry.'",
       "'And is it?'",
       "He looks at the shuttered window for a moment.",
       "'We have been here under an hour,' he says."],
 verse:"Genesis 18:21 — I will go down now, and see.",
 fx:{faith:2,wisdom:1},
 choices:[{t:"Bar the door.", to:"s1d"}]};

N.s1c3 = { act:"The City of the Plain", scene:"sodom",
 where:"The roof", when:"Late",
 text:["From the roof you can see four streets, and there are men coming up all four of them, unhurried, in ones and twos, from every quarter of the city.",
       "Not a mob. Not yet. Something worse: an arrangement. Word has gone round and everyone has decided to come, and they are taking their time, because where exactly is anyone going to go?",
       "You count sixty before you stop counting and go back down the stair fast."],
 verse:"Genesis 19:4 — both old and young, all the people from every quarter.",
 fx:{wisdom:3,courage:1}, mark:"Counted the Street",
 choices:[{t:"Tell them what is coming.", to:"s1d"}]};

N.s1d = { act:"The City of the Plain", scene:"sodom",
 where:"Lot's door", when:"The middle of the night",
 text:["They do not knock. They call.",
       "'Where are the men which came in to thee this night? Bring them out unto us.'",
       "Lot goes out. He pulls the door shut behind him, which is brave, and then he says the thing you will never get out of your head.",
       "He offers them his daughters.",
       "You hear him say it through the wood. Two girls, neither of whom has done anything, offered to a street, to buy a night for two men he met an hour ago.",
       "Inside, one of the strangers closes his eyes briefly, the way a man does at a sound he was hoping not to hear.",
       "Outside the crowd is not even interested. 'Stand back,' they tell Lot. 'This one fellow came in to sojourn, and he will needs be a judge.' And they press on him, and they come near to break the door."],
 verse:"Genesis 19:8 — behold now, I have two daughters.",
 choices:[
  {t:"Open the door, haul Lot in by the collar, and take his place on the step.", fx:{courage:3,faith:2,mercy:2}, mark:"Stood at the Door", to:"s1e"},
  {t:"Go out and tell the street exactly what you think of them.", fx:{courage:2,faith:1}, to:"s1e"},
  {t:"Get the daughters up the back stair and out over the roofs. Now.", fx:{mercy:4,wisdom:2}, mark:"Took the Daughters Up", to:"s1f"},
  {t:"Hold the door and let Lot deal with what Lot has started.", fx:{mercy:-2}, to:"s1f"},
  {t:"Shout through the wood that the daughters are not on offer.", fx:{mercy:2,courage:1}, to:"s1f"}
 ]};

N.s1e = { battle:"thug", scene:"sodom",

N.s1f = { act:"The City of the Plain", scene:"sodom",
 where:"Lot's door", when:"The middle of the night",
 text:["Then the strangers put out their hands, and pull whoever is on the step back inside, and shut the door.",
       "And they smite the men that are at the door with blindness, both small and great, so that they weary themselves to find the door.",
       "It is the sound that stays with you. Sixty men in a lane going quiet all at once, and then the noise they make groping along a wall they have known their whole lives, saying each other's names.",
       "Inside, the taller stranger turns round and looks at you again. Same look as on the step. Past the face.",
       "'You,' he says. 'You will see the end of this.'",
       "You think he means tonight. You are wrong by about four thousand years."],
 verse:"Genesis 19:11 — they wearied themselves to find the door.",
 fx:{faith:2}, mark:"Seen by the Stranger",
 choices:[{t:"“What does that mean?”", to:"s2"},
          {t:"Say nothing. Some questions you do not ask twice.", fx:{wisdom:1}, to:"s2"}]};

N.s2 = { act:"The City of the Plain", scene:"sodom",
 where:"Lot's house", when:"Before dawn",
 text:["'Up,' they say. 'Hast thou here any besides? Son in law, and thy sons, and thy daughters — bring them out of this place.'",
       "Lot goes out to the two men his daughters are promised to and wakes them and tells them, and they laugh at him. One of them is still laughing when Lot comes back. You can hear it down the lane.",
       "'Escape for thy life,' the stranger says. 'Look not behind thee, neither stay thou in all the plain. Escape to the mountain, lest thou be consumed.'",
       "Lot's wife is standing in the doorway of her own good house with her hands at her sides, looking at it."],
 verse:"Genesis 19:17 — look not behind thee.",
 choices:[
  {t:"Take nothing. Go now, while it is dark.", fx:{courage:1}, to:"s3"},
  {t:"Wake the street first. Beat on every door you pass.", fx:{mercy:3,courage:1}, mark:"Cried the Warning", to:"s2b"},
  {t:"Take Lot's wife by the hand and do not let go of it.", fx:{mercy:3,wisdom:1}, mark:"Held Her Hand", to:"s2d"},
  {t:"Go back for the wool. It is a year of your life in those bales.", fx:{faith:-2}, to:"s2c"}
 ]};

N.s2b = { act:"The City of the Plain", scene:"sodom",
 where:"The lower streets", when:"First light",
 text:["You beat on nine doors. Three open. One of them is a woman with a baby on her hip who looks at your face and does not ask a single question, just walks out into the street barefoot and starts running.",
       "Five curse you through the wood. One throws something.",
       "By the time you reach the gate the sky behind you has gone the colour of a forge and the air has begun to sing, high and thin, like a wire.",
       "Somewhere back in it a woman screams your name. You know the voice. It is the one from the market who sold you bread for eleven days."],
 verse:"Genesis 19:24 — the Lord rained upon Sodom brimstone and fire.",
 choices:[
  {t:"Keep your eyes on the mountain. Keep running.", fx:{faith:2,courage:1}, to:"s3"},
  {t:"Turn. You cannot leave her in that.", fx:{mercy:1}, to:"d_salt"},
  {t:"Shout for her to follow — without slowing, without turning your head.", fx:{wisdom:3}, to:"s3"}
 ]};

N.s2c = { act:"The City of the Plain", scene:"sodom",
 where:"Your lodging", when:"First light",
 text:["You are at the doorway with the first bale on your shoulder when something comes through the roof of the house opposite and goes on burning on the floor of it, steadily, like it means to stay.",

N.s2d = { act:"The City of the Plain", scene:"sodom",
 where:"The Zoar road", when:"Sunrise",
 text:["You have her hand the whole way down the lane and out through the gate and a quarter mile along the road, and she is talking the entire time — about the house, about the loom, about a cup her mother gave her.",
       "Then the sky goes white behind you and she stops talking and you feel her turn.",
       "You are holding her hand when it happens. That is the detail. You feel the change go up her arm."],
 verse:"Luke 17:32 — Remember Lot's wife.",

N.s3 = { act:"The City of the Plain", scene:"sodom",
 where:"The ridge above Zoar", when:"Noon",
 text:["Fire comes down in sheets and by noon the valley is one flat white glare with ash settling on your shoulders out of season.",
       "Lot is sitting on a stone with his face in his hands. His daughters are on either side of him, not touching him.",
       "And a little apart, at the edge of the ridge, with his back to the furnace, one of the strangers is standing and looking straight at you.",
       "'Four cities,' he says, when you come up. 'And ten righteous would have bought every one of them. Ten. He could not find ten.'",
       "'Why am I still here?'",
       "'Because somebody has to be,' he says. 'Someone has to see the whole of it and be able to say, at the end, that it was just. It will be a long road and you will not be thanked for it.'",

N.d_square = { end:"death", title:"In the Market Square", scene:"sodom",
 text:["Nine paces was further than most people get.",
       "An hour later two travellers come to the gate and a grey man takes them into his house, and by morning the whole plain is burning. Everyone who laughed at you in that square dies before noon.",
       "It is not a consolation. You had hoped to be useful for longer than nine paces."],
 verse:"Genesis 19:13 — for we will destroy this place."};

/* ================= THE BRIDGES ================= */
/* Each one passes time, ages you, and remembers what you did. */

N.br_egypt = { bridge:true, scene:"wilderness", where:"The long road down into Egypt", when:"Four hundred years",
 text:["You go east first, and then south, and then you stop counting.",
       "Other people get old. You get older too, slowly, and then you stop at somewhere around forty and the years stop showing. You bury a wife in Hebron and two sons after her, and after the second one you stop letting people close enough to bury."],
 dyn:function(s){
   var out = [];
   if (has(s,"Cried the Warning")) out.push("The woman with the baby got out. You hear about her for years afterward, third-hand, in markets — the one who ran barefoot out of Sodom. She names the child after the city, which you think is a strange thing to do until you are much older.");
   if (has(s,"Held Her Hand")) out.push("You still flex that hand sometimes without meaning to. It is the only part of you that feels its age.");
   if (has(s,"Joined the Mob")) out.push("Nobody ever asks what you did in that street. You have had four hundred years to not be asked.");
   if (has(s,"Stood in the Square")) out.push("The Moabite carter lived. He told the story in every caravanserai between Zoar and Damascus for thirty years, and in his version you were considerably taller.");
   out.push("Then Egypt, and brick, and four hundred years of it, and one spring a man with a shepherd's staff and a stammer comes back from the desert with his brother and asks Pharaoh to let the people go.");
   return out;
 },
 choices:[{t:"Go to Goshen.", to:"b1"}]};

N.br_jericho = { bridge:true, scene:"wilderness", where:"The east bank of the Jordan", when:"Forty years on",
 text:["Forty years. You bury people you taught to walk. The manna comes every single morning and you learn to hate it, and then, late, to love it, and on the last morning it does not come and the silence of that is enormous.",
       "The river stands up in a heap and the whole nation walks over on dry ground, and you walk over with them, and you are not young, and you are also not as old as you ought to be, and people have started to notice."],
 dyn:function(s){
   var out = [];
   if (has(s,"Blood on the Door")) out.push("You can still smell hyssop in a hot room. It happens about twice a year and it takes the legs out from under you every time.");
   if (has(s,"Danced at the Calf")) out.push("You do not dance any more. Not at weddings, not at harvest. People think it is piety.");
   if (has(s,"Stood with Caleb")) out.push("Caleb knows your face. He is eighty-five and asking for a mountain. When he passes you in the camp he says, every time, the same two words: 'Still here.'");
   out.push("Ahead of you is a city with walls you can drive a chariot along the top of, and a woman in it who keeps an inn, and neither of those facts means anything to you yet.");
   return out;
 },
 choices:[{t:"Cross over.", to:"j1"}]};

N.br_jael = { bridge:true, scene:"road", where:"The hill country, northward", when:"A hundred and fifty years",
 text:["The conquest finishes and then unfinishes. Joshua dies. The elders who outlived him die. And there arises another generation which knew not the Lord, nor yet the works which he had done for Israel, and the whole thing begins its long slide into the Judges.",
       "You drift north. You are a tent-dweller now, which suits a man who cannot stay anywhere long enough to be remarked on."],
 dyn:function(s){
   var out = [];
   if (has(s,"Scarlet Cord")) out.push("Rahab married into Judah. Her great-grandson will be a man called Boaz and you will meet him in a barley field in about ninety years and not know why the name snags.");
   if (has(s,"Achan's Portion")) out.push("You still dream about the valley sometimes. The heap of stones. The way the whole nation came.");
   out.push("Jabin king of Canaan has nine hundred chariots of iron and has oppressed Israel mightily for twenty years, and a woman called Deborah judges under a palm tree between Ramah and Bethel, and this morning the river Kishon took the chariots.");
   return out;
 },
 choices:[{t:"Peg down the north side.", to:"ja1"}]};

N.br_gideon = { bridge:true, scene:"road", where:"The Valley of Jezreel", when:"Two generations",
 text:["Forty years of quiet, and then the quiet ends the way it always ends.",
       "Midian comes over the Jordan at harvest, as many as locusts for multitude, and Israel goes into the caves and the dens and the strong holds, and threshes wheat in winepresses to hide the dust."],
 dyn:function(s){
   var out = [];
   if (has(s,"The Tent Peg")) out.push("They are still singing the song about Jael. You have heard it four hundred times now. You have never once joined in.");
   if (has(s,"Warned Naboth")) out.push("");
   out.push("An angel sits under an oak in Ophrah and calls a frightened man a mighty man of valour, which is either a joke or a prophecy, and with that man it turns out to be both.");
   return out.filter(function(x){ return x; });
 },
 choices:[{t:"Go down to the water.", to:"gi1"}]};

N.br_sorek = { bridge:true, scene:"road", where:"Down into Philistia", when:"Some years",
 text:["Gideon dies and his seventy sons are murdered on one stone by their own brother, and that is the Judges for you.",
       "You go down into the coastal plain because the famine is worse in the hills, and you take work where work is, and work is in a kitchen in the valley of Sorek."],
 dyn:function(s){
   var out = [];
   if (has(s,"Broke the Pitchers")) out.push("You still wake sometimes at the sound of pottery breaking. Three hundred at once is not a thing you forget.");
   if (has(s,"Shut the Lions' Mouths")) out.push("");
   out.push("There is a man in these parts the Philistines cannot kill. He killed a thousand at Lehi with a jawbone he picked up off the ground. He is not a good man. He is just unkillable, so far, and the difference has started to matter to people.");
   return out.filter(function(x){ return x; });
 },
 choices:[{t:"Light the kitchen fire.", to:"sa1"}]};

N.br_elah = { bridge:true, scene:"road", where:"Back up into Judah", when:"Eighty years",
 text:["Samuel judges Israel all his days, and when he is old the people ask for a king like all the nations have, and he tells them exactly what a king will do to them — take your sons, take your daughters, take the tenth of your seed — and they say: nevertheless.",
       "So there is a king now. A tall one. He started well."],
 dyn:function(s){
   var out = [];
   if (has(s,"Cleared the East Door")) out.push("Two of the children you pulled out of Dagon's house grew up. One of them became a potter in Ashkelon. You bought a jar from him once, decades later, and he did not know you, and you did not say.");
   if (has(s,"Warned the Strong Man")) out.push("'I know,' he said. You have had eighty years to work out what he meant and you are no closer.");
   out.push("Now the Philistines are drawn up at Shochoh and Israel is on the other hill, and there is a man coming down into the valley every morning and every evening for forty days asking somebody — anybody — to come out and fight him.");
   return out;
 },
 choices:[{t:"Pick up the shield.", to:"e1"}]};

N.br_endor = { bridge:true, scene:"road", where:"Following the king's camp", when:"Twenty years",
 text:["The boy from the brook is a man now and the king has tried to kill him eleven times, and the kingdom has split down the middle into those who say so out loud and those who do not.",
       "You carry a spear in the king's own guard, which is a strange place to end up and a worse place to stay."],
 dyn:function(s){
   var out = [];
   if (has(s,"Felled the Giant")) out.push("They sing a song about you in the streets. Saul has heard it. Saul has heard it many times. It is not a good song to have sung about you within earshot of this particular king.");
   if (has(s,"Fled the Valley")) out.push("You were at the baggage that day. Nobody has ever said anything about it. You have said quite a lot about it, to yourself, for twenty years.");
   if (has(s,"Carried the Sick")) out.push("The man from the ditch found you once, years later, in Hebron, and would not stop thanking you, and you could not remember his face at all, and you have been ashamed of that ever since.");
   out.push("Samuel is dead and buried in Ramah. The Philistines are gathered at Shunem. And the king, who put every medium and wizard out of the land himself, has just asked his servants to find him one.");
   return out;
 },
 choices:[{t:"Fetch his other coat.", to:"en1"}]};

N.br_david = { bridge:true, scene:"road", where:"Jerusalem", when:"A generation",
 text:["Saul and his sons die on Gilboa in one afternoon and the man from the brook weeps for them properly, which surprises everybody, and then reigns forty years.",
       "He takes the stronghold of Zion. He brings the ark up dancing before it with all his might, in a linen ephod, and his wife despises him in her heart for it, and that marriage never recovers.",
       "You carry messages for him now. It is a good post."],
 dyn:function(s){
   var out = [];
   if (has(s,"Walked the King Out")) out.push("You sat with Saul on a stone in a field the night before Gilboa and he said he was afraid. You have never told anyone that. You never will. It is the only secret you have kept for a whole lifetime.");
   if (has(s,"Looked in the Circle")) out.push("Something looked back at you at Endor. It has not stopped. You feel it occasionally in crowded rooms, patient, like a creditor.");
   out.push("It is spring, the time when kings go out to battle. The army is at Rabbah. The king is not.");
   return out;
 },
 choices:[{t:"Go up to the roof.", to:"ba1"}]};

N.br_naboth = { bridge:true, scene:"road", where:"Northward, into Israel", when:"Eighty years",
 text:["Solomon builds the temple and it is the most beautiful thing you have ever stood inside, and then he builds high places for Chemosh and Molech on the hill before Jerusalem, for his wives, and you stand on that hill too and look at both and understand nothing.",
       "The kingdom tears in half at Shechem over a tax question. Ten tribes go north. The north gets Jeroboam and two golden calves at Bethel and Dan, and after that a run of kings so bad they start to blur, until Ahab, who marries a Sidonian."],
 dyn:function(s){
   var out = [];
   if (has(s,"Burned the Letter")) out.push("Uriah the Hittite lived another nineteen years and died at Rabbah in a trench with everyone else, which is the death he would have chosen, and nobody but you ever knew there had been a choice about it.");
   if (has(s,"Carried the Letter")) out.push("You can still feel the weight of a sealed letter in your hand. It was not heavy. That is what you keep coming back to. It weighed nothing at all.");
   if (has(s,"Named the Husband")) out.push("You said the name out loud on that roof and it changed nothing, and you have never been sure whether saying it counted for anything. You suspect it did. You cannot prove it.");
   out.push("You are an elder in Jezreel now. It took fifty years of being careful to get here, and this morning a letter arrived with the king's seal on it.");
   return out;
 },
 choices:[{t:"Break the seal.", to:"nv1"}]};

N.br_carmel = { bridge:true, scene:"road", where:"Up Carmel", when:"Three years without rain",
 text:["Three years. The brooks go first, then the wells, then the cattle. Obadiah the governor of Ahab's house has a hundred prophets hidden in two caves and feeds them bread and water out of the king's own stores, which is the bravest thing happening in Israel and nobody knows about it.",
       "And then the man in the hairy mantle comes back out of nowhere and tells Ahab to gather all Israel to Carmel."],
 dyn:function(s){
   var out = [];
   if (has(s,"Warned Naboth")) out.push("Naboth's sons are in Gilead. You get a message once a year, by a carter, with no words in it — just a dried vine leaf. You have nine of them in a box.");
   if (has(s,"Bore False Witness")) out.push("You sat in that seat and said those words and the dogs were at his blood before anyone moved the body. You have not slept a whole night since.");
   if (has(s,"Refused the Letter")) out.push("They found their second witness without you. You have never decided whether refusing counted, given that it changed nothing, and you have had a long time to decide.");
   out.push("Two bullocks. Two altars. No fire. And four hundred and fifty men on one side of the hill and one man on the other.");
   return out;
 },
 choices:[{t:"Climb.", to:"c1"}]};

N.br_babylon = { bridge:true, scene:"road", where:"The road east, in a line", when:"Three hundred years",
 text:["The north falls to Assyria and ten tribes walk east and do not come back. Judah lasts another hundred and thirty years on borrowed time and a few good kings.",
       "Then Nebuchadnezzar. The temple burns for three days. You watch the bronze sea broken up for scrap by men who are bored.",
       "You walk east in a line of captives, and you have done this before, and that is somehow the worst part — that you know the shape of it, that you know roughly how many will die on the road."],
 dyn:function(s){
   var out = [];
   if (has(s,"Threw Down the Altar")) out.push("You saw fire fall on Carmel and lick up the water in the trench. You bring that out and look at it on the bad nights, the way a man looks at a deed to land he can no longer reach.");
   out.push("Babylon is beautiful. That is the thing nobody warns you about. The walls, the gate, the gardens on the terraces. You can see why people stay.");
   return out;
 },
 choices:[{t:"Walk east.", to:"k1"}]};

N.br_herod = { bridge:true, scene:"road", where:"Back to Jerusalem, and then a long wait", when:"Five hundred and seventy years",
 text:["Cyrus lets them go home. The second temple is smaller and the old men who remember the first one weep while the young men cheer, and from a distance you cannot tell the two sounds apart.",
       "Then Malachi stops writing, and nothing. Four hundred years of nothing. Greeks, and then a revolt, and then a family of priest-kings who go rotten, and then Rome, and a half-Edomite client king who rebuilds the temple enormous and murders three of his own sons.",
       "Four hundred years with no prophet. You start to wonder whether the stranger on the ridge was a fever."],
 dyn:function(s){
   var out = [];
   if (has(s,"Walked in the Fire")) out.push("There were four of us in that furnace and one of them was not a man. You hold that against the four hundred silent years and the four hundred years lose.");
   if (has(s,"Shut the Lions' Mouths")) out.push("A lion sighed, once, in the dark, about a foot from your face, and went to sleep. You have never been properly afraid of anything since. It is not always an advantage.");
   if (has(s,"Bowed at Dura")) out.push("Your knees still remember the plain of Dura. That is not a figure of speech; they ache in cold weather and you know exactly why.");
   out.push("Then, in the fifteenth year of Tiberius, a man in camel's hair comes out of the wilderness by Jordan shouting that someone is coming, and the whole country goes out to look at him, and it starts again.");
   return out;
 },
 choices:[{t:"Take the post at Machaerus.", to:"he1"}]};

N.br_teacher = { bridge:true, scene:"road", where:"North, into Galilee", when:"Within the year",
 text:["You hand in your mail and go north because you cannot stay in that fortress another week.",
       "Galilee is green. There is a carpenter from Nazareth going round the towns there who has started saying things in synagogues that get him thrown out of them, and healing people on the wrong day of the week about it."],
 dyn:function(s){
   var out = [];
   if (has(s,"Opened the Grating")) out.push("You stood in the Jordan the day the sky opened. You have told nobody, because there is no sentence that survives being said out loud.");
   if (has(s,"Carried the Word")) out.push("You kept your promise. His disciples came with the cart at dawn and you let them through the gate yourself, and one of them gripped your arm so hard it bruised, and nobody said anything at all.");
   if (has(s,"Stood the Post")) out.push("You stood your post. It was a lawful order. You have said that sentence to yourself several thousand times now and it has never once worked.");
   out.push("Four thousand years, give or take, since a stranger on a ridge above a burning valley told you that you would see the end of this.");
   out.push("You have a feeling you are getting close.");
   return out;

var Snd = (function(){

function pickWeighted(list){
  var tot = 0, i;
  for (i=0;i<list.length;i++) tot += (list[i].w||1);
  var r = Math.random()*tot;
  for (i=0;i<list.length;i++){ r -= (list[i].w||1); if (r <= 0) return list[i]; }
  return list[list.length-1];
}

}

/* ================= feedback ================= */
var floatHost = null;
function showFloats(list){

      floatHost.appendChild(e);

    }, i * 170);

}
function snapshotStats(){
  return {faith:S.faith, wisdom:S.wisdom, courage:S.courage, mercy:S.mercy,
          vigor:S.vigor, items:(S.items||[]).slice(), marks:(S.marks||[]).slice()};
}
function diffStats(before){
  var out = [];
  [["faith","FAITH"],["courage","COURAGE"],["wisdom","WISDOM"],["mercy","MERCY"]].forEach(function(p){
    var dv = S[p[0]] - before[p[0]];
    if (dv) out.push({t:(dv>0?"+":"") + dv + " " + p[1], cls:dv>0?"up":"down"});
  });
  var dvg = S.vigor - before.vigor;
  if (dvg) out.push({t:(dvg>0?"+":"") + dvg + " VIGOR", cls:dvg>0?"up":"down"});
  (S.items||[]).forEach(function(id){
    if (before.items.indexOf(id) < 0 && ITEMS[id]) out.push({t:"FOUND  " + ITEMS[id].name.toUpperCase(), cls:"item"});
  });
  (S.marks||[]).forEach(function(m){
    if (before.marks.indexOf(m) < 0) out.push({t:"MARK  " + m.toUpperCase(), cls:"mark"});
  });
  return out;
}

/* ================= conditions ================= */
function conditions(){
  var out = [];

  if (pct <= 0.25) out.push({t:"BLEEDING", cls:"hurt"});
  else if (pct <= 0.55) out.push({t:"WOUNDED", cls:"hurt"});

  else if (S.faith <= 4) out.push({t:"FALTERING", cls:"afraid"});

  if (w) out.push({t:w.name.toUpperCase(), cls:"armed"});

}

/* ================= navigation ================= */
function go(id){
  var node = N[id];
  if (!node){ id = "s1"; node = N.s1; }
  var guard = 0;
  while (node && (node.check || node.compute) && guard++ < 10){
    apply(S, node.fx);
    var next = node.compute ? node.compute(S) : (node.check(S) ? node.pass : node.fail);
    id = next; node = N[id];
  }
  if (!node){ id = "e_dark"; node = N.e_dark; }
  apply(S, node.fx);
  if (node.mark && S.marks.indexOf(node.mark) < 0) S.marks.push(node.mark);
  giveItems(node.give);
  if (node.hurt) S.vigor = Math.max(1, S.vigor - node.hurt);
  if (node.newact && diff().heal > 0 && S.vigor < S.maxVigor){
    S.vigor = Math.min(S.maxVigor, S.vigor + diff().heal);
  }
  S.node = id;
  if (node.newact && node.act) actCard(node);
  if (node.end) markFound(id);
  store(KEY, JSON.stringify(S));
  draw();
}
function choose(c){
  Snd.wake(); Snd.pick();
  var snap = snapshotStats();
  apply(S, c.fx);
  if (c.mark && S.marks.indexOf(c.mark) < 0) S.marks.push(c.mark);
  giveItems(c.give);
  go(c.to);
  var deltas = diffStats(snap);
  showFloats(deltas);
  var now = N[S.node];
  if (now && !now.end && !now.battle){
    if (S.faith > snap.faith) Snd.good();
    else if (S.faith < snap.faith) Snd.bad();
  }
}

/* ================= combat ================= */
function startBattle(node){
  var proto = FOES[node.battle];
  var scale = diff().foe;
  B = {
    key: node.battle,
    foe: proto,
    hp: Math.round(proto.hp * scale),
    maxHp: Math.round(proto.hp * scale),
    node: node,
    log: [],
    guard: 0,
    fear: 0,
    stunned: false,
    turn: 0,
    over: false,
    rolled: null
  };
  (node.intro||[]).forEach(function(t){ B.log.push({t:t}); });
  Snd.battle();
}
function blog(t, cls){ B.log.push({t:t, cls:cls}); if (B.log.length > 40) B.log.shift(); }

function playerAttack(){
  var w = weapon();
  var roll = d(6), bonus = Math.floor(S.courage/3) + (w ? w.atk : 1);
  if (B.fear > 0) bonus -= 1;
  var total = roll + bonus;
  var target = 4 + (B.foe.guard||0);
  B.rolled = {v:roll, crit:roll===6, fumble:roll===1};
  blog("d6 → " + roll + "  +" + bonus + " = " + total + "  (need " + target + ")", "roll");
  Snd.swing();
  if (roll === 1){
    blog("You swing wide and the weight of it carries you past him.", "hurt");
    return foeTurn(true);
  }
  if (total >= target || roll === 6){
    var dmg = d(4) + (w ? w.atk : 1) + Math.floor(S.courage/4);
    if (roll === 6){ dmg = Math.round(dmg * 1.8); blog("Clean through his guard.", "hit"); Snd.crit(); }
    else Snd.hit();
    if (w && w.wild && d(2) === 2) { dmg += 3; blog("The jawbone does something unspeakable.", "hit"); }
    B.hp -= dmg;
    blog("You strike for " + dmg + ".", "hit");
    if (B.hp <= 0) return endBattle(true);
  } else {
    blog("He turns it on his guard.", "hurt");
  }
  return foeTurn(false);
}
function playerGuard(){
  var w = weapon();
  B.guard = 3 + (w && w.guardBonus ? w.guardBonus : 0) + Math.floor(S.wisdom/4);
  blog("You set your feet and cover up. (-" + B.guard + " to the next blow)", "holy");
  return foeTurn(false);
}
function playerPray(){
  if (S.faith < 2){ blog("You reach for words and find none.", "hurt"); return foeTurn(false); }
  S.faith -= 2;
  Snd.pray();
  var roll = d(6);
  B.rolled = {v:roll, crit:roll===6, fumble:false};
  blog("d6 → " + roll + "  (prayer)", "roll");
  if (B.foe.unholy){
    var dmg = 4 + roll + Math.floor(S.faith/3);
    B.hp -= dmg;
    blog("The name lands on it like a weight. " + dmg + " damage.", "holy");
    if (B.hp <= 0) return endBattle(true);
  } else if (roll >= 5){
    var h = 6 + Math.floor(S.faith/3);
    S.vigor = Math.min(S.maxVigor, S.vigor + h);
    B.guard += 2;
    blog("Something steadies in your chest. +" + h + " vigor.", "holy");
    Snd.heal();
  } else if (roll >= 3){
    B.fear = 0;
    B.guard += 3;
    blog("The fear goes out of you, which is not nothing.", "holy");
  } else {
    blog("You pray and the sky is the sky and he is still coming.", "hurt");
  }
  S.faith += 1;
  return foeTurn(false);
}
function playerItem(id){
  var it = ITEMS[id];
  if (!it) return;
  if (it.heal){ S.vigor = Math.min(S.maxVigor, S.vigor + it.heal); blog("You use the " + it.name + ". +" + it.heal + " vigor.", "holy"); Snd.heal(); }
  if (it.courage){ S.courage += it.courage; blog("+" + it.courage + " courage.", "holy"); }
  if (it.faith){ S.faith += it.faith; blog("+" + it.faith + " faith.", "holy"); }
  if (it.rebuke && B.foe.unholy){
    var dmg = 8 + Math.floor(S.faith/2);
    B.hp -= dmg;
    blog("The words go through it. " + dmg + " damage.", "holy");
    if (B.hp <= 0){ dropItem(id); return endBattle(true); }
  }
  dropItem(id);
  return foeTurn(false);
}
function playerFlee(target){
  var roll = d(6) + Math.floor(S.wisdom/3);
  B.rolled = {v:roll, crit:false, fumble:false};
  blog("d6 → " + roll + "  (need " + B.foe.flee + " to break away)", "roll");
  if (roll >= B.foe.flee){
    S.fled = (S.fled||0) + 1;
    S.courage = Math.max(0, S.courage - 1);
    B.over = true;
    blog("You break off and go, and you keep going.", "hurt");
    store(KEY, JSON.stringify(S));
    drawBattle();
    setTimeout(function(){ B = null; go(target); }, 900);
    return;
  }
  blog("There is nowhere to go.", "hurt");
  return foeTurn(false);
}

function foeTurn(playerMissed){
  if (B.over) return;
  B.turn++;
  if (B.stunned){
    B.stunned = false;
    blog("He is still getting his feet back under him.", "holy");
    return finishTurn();
  }
  var mv = pickWeighted(B.foe.moves);
  blog("He " + mv.t + ".", "hurt");
  if (mv.whiff){ blog("Nothing answers him.", "holy"); return finishTurn(); }
  if (mv.rally){ B.hp = Math.min(B.maxHp, B.hp + 4); blog("Help is coming to him. (+4)", "hurt"); return finishTurn(); }
  if (mv.steal && S.items.length){
    var victim = S.items[Math.floor(Math.random()*S.items.length)];
    if (ITEMS[victim].kind !== "token"){ dropItem(victim); blog("He takes your " + ITEMS[victim].name + " and is gone with it.", "hurt"); }
  }
  if (mv.fear){ B.fear = 2; blog("Something in you wants very badly to be elsewhere.", "hurt"); }
  if (mv.despair){ S.faith = Math.max(0, S.faith - 2); blog("Two points of faith go out like a lamp.", "hurt"); }
  if (mv.charge){ B.charging = true; blog("He is setting himself for the next one.", "hurt"); return finishTurn(); }

  var lo = B.foe.dmg[0], hi = B.foe.dmg[1];
  var dmg = lo + Math.floor(Math.random()*(hi-lo+1));
  dmg = Math.round(dmg * diff().foe);
  if (B.charging){ dmg = Math.round(dmg * 1.6); B.charging = false; blog("All of his weight is behind it.", "hurt"); }
  if (playerMissed) dmg += 1;
  var a = armor();
  var soak = (a ? a.soak : 0) + B.guard;
  if (!mv.pierce && soak > 0){
    var blocked = Math.min(dmg - 1, soak);
    if (blocked > 0){ dmg -= blocked; blog("You turn " + blocked + " of it.", "holy"); }
  }
  B.guard = 0;
  if (mv.stun) B.stunned = false;
  dmg = Math.max(1, dmg);
  S.vigor -= dmg;
  Snd.hurt();
  blog("You take " + dmg + ".", "hurt");
  if (S.vigor <= 0){
    if (S.items.indexOf("cord") >= 0){
      dropItem("cord");
      S.vigor = Math.max(6, Math.floor(S.maxVigor/3));
      blog("The scarlet cord is in your fist and you do not die. It is spent now.", "holy");
      Snd.heal();
      return finishTurn();
    }
    return endBattle(false);
  }
  return finishTurn();
}
function finishTurn(){
  if (B.fear > 0) B.fear--;
  store(KEY, JSON.stringify(S));
  drawBattle();
}
function endBattle(won){
  B.over = true;
  if (won){
    Snd.foeDown();
    blog("He is down and not getting up.", "hit");
    S.kills = (S.kills||0) + 1;
  } else {
    blog("You cannot get up.", "hurt");
  }
  drawBattle();
  var target = won ? B.node.win : B.node.lose;
  setTimeout(function(){ B = null; go(target); }, won ? 1100 : 1400);
}

function drawEnding(node){

  var led = el("div","ledger");

  led.appendChild(stats);

  var found = foundSet();
  var gal = el("div","ledger");
  gal.appendChild(el("div","section-lab","Endings found — " + found.length + " of " + ALL_ENDINGS.length));
  var grid = el("div","gallery");
  ALL_ENDINGS.forEach(function(id){
    var got = found.indexOf(id) >= 0;
    grid.appendChild(el("div","slot" + (got?" got":""), got ? N[id].title : "— — —"));
  });
  gal.appendChild(grid);
  frag.appendChild(gal);

  var row = el("div","row");
  var again = el("button","go","Begin again");
  again.type = "button";
  again.addEventListener("click", function(){ store(KEY,null); S = null; draw(); });
  row.appendChild(again);
  var same = el("button","ghost","Same character, new life");
  same.type = "button";
  same.addEventListener("click", function(){
    S = fresh(S.name, S.origin, S.diff); store(KEY, JSON.stringify(S)); draw();
  });
  row.appendChild(same);
  frag.appendChild(row);

  app.innerHTML = "";
  app.appendChild(frag);
  window.__live = [];
}

function drawTitle(){
  var frag = document.createDocumentFragment();
  lastAct = null;
  frag.appendChild(sceneWindow("title"));
  var head = el("div"); head.className = "stack";
  head.appendChild(el("h1",null,"THE NARROW WAY"));
  head.appendChild(el("p","byline","by Andrew Gooden"));
  head.appendChild(el("p","tagline","Ten acts from Sodom to the last day. Twenty-five endings, ten battles, and a ledger that is read back to you at the end."));
  frag.appendChild(head);

  var card = el("div","card");
  var f1 = el("div","field");
  var lab1 = el("label","lab","What are you called");
  lab1.setAttribute("for","nm");
  var inp = document.createElement("input");
  inp.type = "text"; inp.id = "nm"; inp.maxLength = 24;
  inp.placeholder = "Enter a name"; inp.autocomplete = "off";
  f1.appendChild(lab1); f1.appendChild(inp);
  card.appendChild(f1);

  var picked = null, pickedDiff = "sojourner";

  var f2 = el("div","field");
  f2.appendChild(el("span","lab","Where you come from"));
  var grid = el("div","origins");
  ORIGINS.forEach(function(o){
    var b = el("button","origin");
    b.type = "button"; b.setAttribute("aria-pressed","false");
    b.appendChild(el("span","t", o.name));
    b.appendChild(el("span","b", o.blurb));
    var fxTxt = Object.keys(o.fx).map(function(k){ return "+"+o.fx[k]+" "+k; }).join(", ");
    if (o.vigor) fxTxt += ", +" + o.vigor + " vigor";
    b.appendChild(el("span","b", fxTxt));
    b.appendChild(el("span","k", "Carries: " + (o.kit||[]).map(function(i){return ITEMS[i].name;}).join(", ")));
    b.addEventListener("click", function(){
      picked = o.id;
      grid.querySelectorAll(".origin").forEach(function(x){ x.setAttribute("aria-pressed","false"); });
      b.setAttribute("aria-pressed","true");
      start.disabled = false;
    });
    grid.appendChild(b);
  });
  f2.appendChild(grid);
  card.appendChild(f2);

  var f3 = el("div","field");
  f3.appendChild(el("span","lab","How hard"));
  var dgrid = el("div","origins");
  Object.keys(DIFFS).forEach(function(k){
    var dd = DIFFS[k];
    var b = el("button","origin");
    b.type = "button";
    b.setAttribute("aria-pressed", k === "sojourner" ? "true" : "false");
    b.appendChild(el("span","t", dd.name + " · " + dd.label));
    b.appendChild(el("span","b", dd.blurb));
    b.addEventListener("click", function(){
      pickedDiff = k;
      dgrid.querySelectorAll(".origin").forEach(function(x){ x.setAttribute("aria-pressed","false"); });
      b.setAttribute("aria-pressed","true");
    });
    dgrid.appendChild(b);
  });
  f3.appendChild(dgrid);
  card.appendChild(f3);

  var row = el("div","row");
  var start = el("button","go","Begin");
  start.type = "button"; start.disabled = true;
  start.addEventListener("click", function(){
    var nm = (inp.value||"").trim() || "The Wanderer";
    S = fresh(nm, picked, pickedDiff);
    store(KEY, JSON.stringify(S));
    draw();
  });
  row.appendChild(start);
  var saved = load(KEY);
  if (saved){
    var cont = el("button","ghost","Continue your run");
    cont.type = "button";
    cont.addEventListener("click", function(){
      try{ S = JSON.parse(saved); }catch(e){ S = null; }
      if (S){ if (S.vigor == null){ S.vigor = 20; S.maxVigor = 20; } if (!S.items) S.items = []; draw(); }
    });
    row.appendChild(cont);
  }
  card.appendChild(row);
  frag.appendChild(card);

  var found = foundSet();
  if (found.length){
    var gal = el("div","ledger");
    gal.appendChild(el("div","section-lab","Endings found — " + found.length + " of " + ALL_ENDINGS.length));
    var g2 = el("div","gallery");
    ALL_ENDINGS.forEach(function(id){
      var got = found.indexOf(id) >= 0;
      g2.appendChild(el("div","slot" + (got?" got":""), got ? N[id].title : "— — —"));
    });
    gal.appendChild(g2);
    frag.appendChild(gal);
  }

  app.innerHTML = "";
  app.appendChild(frag);
  window.__live = [];
}

function draw(){
  resetBtn.hidden = !S;
  if (!S){
    footnote.textContent = "The Narrow Way — a game by Andrew Gooden";
    drawTitle(); window.scrollTo(0,0); return;
  }
  var node = N[S.node] || N.s1;
  if (node.battle){
    footnote.textContent = "Battle — roll well.";
    if (!B || B.node !== node) startBattle(node);
    drawBattle();
    window.scrollTo(0,0);
    return;
  }
  B = null;
  footnote.textContent = "Press 1-9 to choose. Your run is saved in this browser.";
  if (node.end) drawEnding(node); else drawStory(node);
  window.scrollTo(0,0);
}

/* ================= controls ================= */
resetBtn.addEventListener("click", function(){ store(KEY,null); S = null; B = null; draw(); });

var soundBtn = document.getElementById("sound");
function syncSound(){
  soundBtn.textContent = Snd.isOn() ? "Sound on" : "Sound off";
  soundBtn.setAttribute("aria-pressed", Snd.isOn() ? "true" : "false");
}
if (load(SKEY) === "0") Snd.setOn(false);
syncSound();
soundBtn.addEventListener("click", function(){
  var v = !Snd.isOn(); Snd.setOn(v); store(SKEY, v ? "1" : "0"); syncSound();
});
document.addEventListener("pointerdown", function(){ Snd.wake(); });
document.addEventListener("keydown", function(e){
  Snd.wake();
  if (e.target && e.target.tagName === "INPUT") return;
  var n = parseInt(e.key,10);
  if (!n || !window.__live || !window.__live.length) return;
  var c = window.__live[n-1];
  if (!c || !meets(S, c.req)) return;
  choose(c);
});

/* ================= splash ================= */
(function(){
  var sp = document.getElementById("splash");
  if (!sp) return;
  var art = document.getElementById("splashArt");
  var done = false, flick = null;
  document.body.setAttribute("data-splash","1");
  drawGrid(art, LAMP, 32, 32, null);
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (!reduce){
    var alts = ["#d9622b","#e0b24a","#b8432a","#f0943f"], i = 0;
    flick = setInterval(function(){ i++; drawGrid(art, LAMP, 32, 32, {O: alts[i % alts.length]}); }, 380);
  }
  function dismiss(){
    if (done) return;
    done = true;
    if (flick) clearInterval(flick);
    Snd.wake();
    sp.setAttribute("data-going","1");
    document.body.removeAttribute("data-splash");
    setTimeout(function(){ if (sp.parentNode) sp.parentNode.removeChild(sp); }, 900);
  }
  sp.addEventListener("click", dismiss);
  document.addEventListener("keydown", function once(){ dismiss(); document.removeEventListener("keydown", once); });
  setTimeout(dismiss, 6500);
})();

/* ================= boot ================= */
function boot(data){
  if (data && data.S){ S = data.S; }
  else {
    var saved = load(KEY);
    if (saved){ try{ S = JSON.parse(saved); }catch(e){ S = null; } }
  }
  if (S){
    if (S.vigor == null){ S.vigor = 20; S.maxVigor = 20; }
    if (!S.items) S.items = [];
    if (!S.diff) S.diff = "sojourner";
  }
  draw();
}
try{
  if (window.claude && window.claude.hot && window.claude.hot.snapshot){
    window.claude.hot.snapshot(function(){ return {S:S}; });
  }
}catch(e){}
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(boot);
else boot((window.claude && window.claude.hot && window.claude.hot.data) || {});
</script>

</body>
