plugins { id 'com.android.application' }

android {
    namespace 'com.narrowway.game'
    compileSdk 34

    defaultConfig {
        applicationId "com.narrowway.game"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
